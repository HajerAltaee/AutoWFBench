[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autowfbench"
version = "0.1.0"
description = "Evidence-driven benchmarks for replaceable automation workflows"
requires-python = ">=3.11"
dependencies = ["fastjsonschema>=2.21,<3"]

[project.scripts]
autowfbench = "autowfbench.__main__:main"

[tool.setuptools.packages.find]
include = ["autowfbench*"]

[tool.setuptools.package-data]
autowfbench = ["web/*"]
